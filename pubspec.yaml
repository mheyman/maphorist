name: maphorist
description: DC-area route planning with a choice of regular and express lanes.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  ffi: ^2.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

